{% extends "base.html" %} {% block content %}
<!-- Mobile-First Layout: Controls overlay on map -->
<div class="relative w-full h-full flex flex-col lg:flex-row">
  <!-- Map Container (Full background on mobile, right side on desktop) -->
  <div class="absolute inset-0 lg:relative lg:w-2/3 h-full">
    <div id="map" class="w-full h-full"></div>

    <!-- Map Overlay Instructions -->
    <div
      id="map-hint"
      class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-white/90 backdrop-blur px-4 py-2 rounded-full shadow-lg text-sm font-medium text-slate-700 pointer-events-none transition-opacity duration-300"
    >
      <i class="fas fa-hand-pointer mr-2 text-blue-500"></i>
      Tap stops on map to select
    </div>
  </div>

  <!-- Control Panel (Bottom sheet on mobile, sidebar on desktop) -->
  <div
    class="absolute bottom-0 left-0 right-0 lg:relative lg:w-1/3 lg:h-full bg-white lg:border-l border-slate-200 shadow-2xl lg:shadow-none z-10 flex flex-col max-h-[70vh] lg:max-h-full transition-transform duration-300 ease-out transform translate-y-0"
    id="control-panel"
  >
    <!-- Drag Handle (mobile only) -->
    <div
      class="lg:hidden w-full flex justify-center pt-3 pb-1 cursor-pointer"
      id="panel-handle"
    >
      <div class="w-12 h-1.5 bg-slate-300 rounded-full"></div>
    </div>

    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto custom-scrollbar p-4 lg:p-6 space-y-6">
      <!-- Route Planner Form -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold text-slate-900">Plan Your Route</h2>
          <button
            id="locate-btn"
            class="text-sm text-blue-600 hover:text-blue-700 font-medium flex items-center gap-1"
          >
            <i class="fas fa-location-arrow"></i>
            <span class="hidden sm:inline">Use my location</span>
          </button>
        </div>

        <!-- Origin Input -->
        <div class="relative group">
          <label
            class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5"
            >Origin</label
          >
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
            >
              <div class="w-2 h-2 rounded-full bg-blue-500"></div>
            </div>
            <select
              id="origin-select"
              class="block w-full pl-8 pr-10 py-3 text-base border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent rounded-xl bg-slate-50 hover:bg-white border transition-colors appearance-none cursor-pointer"
            >
              <option value="">Select starting point...</option>
              {% for campus in campuses %}
              <optgroup label="{{ campus }}">
                {% for sid, stop in stops.items() if stop.campus_location ==
                campus %}
                <option
                  value="{{ sid }}"
                  data-lat="{{ stop.lat or '' }}"
                  data-lng="{{ stop.lng or '' }}"
                >
                  {{ stop.stop_name }}
                </option>
                {% endfor %}
              </optgroup>
              {% endfor %}
            </select>
            <div
              class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none"
            >
              <i class="fas fa-chevron-down text-slate-400 text-xs"></i>
            </div>
          </div>
        </div>

        <!-- Swap Button -->
        <div class="flex justify-center -my-2 relative z-10">
          <button
            id="swap-btn"
            class="bg-white border border-slate-200 shadow-sm rounded-full p-2 hover:bg-slate-50 hover:shadow-md transition-all transform hover:rotate-180 duration-300 text-slate-500"
          >
            <i class="fas fa-exchange-alt"></i>
          </button>
        </div>

        <!-- Destination Input -->
        <div class="relative">
          <label
            class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5"
            >Destination</label
          >
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
            >
              <div class="w-2 h-2 rounded-full bg-green-500"></div>
            </div>
            <select
              id="dest-select"
              class="block w-full pl-8 pr-10 py-3 text-base border-slate-200 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent rounded-xl bg-slate-50 hover:bg-white border transition-colors appearance-none cursor-pointer"
            >
              <option value="">Select destination...</option>
              {% for campus in campuses %}
              <optgroup label="{{ campus }}">
                {% for sid, stop in stops.items() if stop.campus_location ==
                campus %}
                <option
                  value="{{ sid }}"
                  data-lat="{{ stop.lat or '' }}"
                  data-lng="{{ stop.lng or '' }}"
                >
                  {{ stop.stop_name }}
                </option>
                {% endfor %}
              </optgroup>
              {% endfor %}
            </select>
            <div
              class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none"
            >
              <i class="fas fa-chevron-down text-slate-400 text-xs"></i>
            </div>
          </div>
        </div>

        <!-- Preference Selection -->
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
          <label
            class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3"
            >Route Preference</label
          >
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input
                type="radio"
                name="preference"
                value="speed"
                class="peer sr-only"
                checked
              />
              <div
                class="text-center py-2.5 px-2 rounded-lg border border-slate-200 peer-checked:border-blue-500 peer-checked:bg-blue-50 peer-checked:text-blue-700 transition-all hover:bg-white"
              >
                <i class="fas fa-bolt mb-1 block text-lg"></i>
                <span class="text-xs font-medium">Fastest</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input
                type="radio"
                name="preference"
                value="cost"
                class="peer sr-only"
              />
              <div
                class="text-center py-2.5 px-2 rounded-lg border border-slate-200 peer-checked:border-green-500 peer-checked:bg-green-50 peer-checked:text-green-700 transition-all hover:bg-white"
              >
                <i class="fas fa-coins mb-1 block text-lg"></i>
                <span class="text-xs font-medium">Cheapest</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input
                type="radio"
                name="preference"
                value="balanced"
                class="peer sr-only"
              />
              <div
                class="text-center py-2.5 px-2 rounded-lg border border-slate-200 peer-checked:border-purple-500 peer-checked:bg-purple-50 peer-checked:text-purple-700 transition-all hover:bg-white"
              >
                <i class="fas fa-balance-scale mb-1 block text-lg"></i>
                <span class="text-xs font-medium">Balanced</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Find Button -->
        <button
          id="find-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span>Find Routes</span>
          <i class="fas fa-search"></i>
        </button>

        <!-- Error Message -->
        <div
          id="error-msg"
          class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm flex items-start gap-2"
        >
          <i class="fas fa-exclamation-circle mt-0.5"></i>
          <span id="error-text"></span>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading-state" class="hidden py-8 text-center">
        <div class="relative inline-block mb-4">
          <div
            class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"
          ></div>
        </div>
        <p class="text-slate-600 font-medium">Exploring campus routes...</p>
        <p class="text-slate-400 text-sm mt-1">
          Checking buses, shuttles, and walkways
        </p>
      </div>

      <!-- Results Section -->
      <div id="results-section" class="hidden space-y-4">
        <div
          class="flex items-center justify-between border-b border-slate-200 pb-2"
        >
          <h3 class="font-bold text-slate-900">Suggested Routes</h3>
          <span
            id="results-count"
            class="text-xs font-medium bg-slate-100 text-slate-600 px-2 py-1 rounded-full"
            >0 found</span
          >
        </div>

        <div id="routes-container" class="space-y-3">
          <!-- Route cards injected here -->
        </div>
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="text-center py-8 text-slate-400">
        <i class="fas fa-route text-4xl mb-3 opacity-30"></i>
        <p class="text-sm">
          Select origin and destination to see available routes
        </p>
      </div>
    </div>
  </div>
</div>

<!-- Route Detail Modal (Mobile optimized) -->
<div id="route-modal" class="fixed inset-0 z-50 hidden">
  <div
    class="absolute inset-0 bg-black/50 backdrop-blur-sm"
    id="modal-backdrop"
  ></div>
  <div
    class="absolute bottom-0 left-0 right-0 lg:top-1/2 lg:left-1/2 lg:bottom-auto lg:right-auto lg:transform lg:-translate-x-1/2 lg:-translate-y-1/2 bg-white lg:rounded-2xl rounded-t-2xl w-full lg:w-[500px] max-h-[80vh] overflow-hidden shadow-2xl"
  >
    <div
      class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50"
    >
      <h3 class="font-bold text-lg text-slate-900">Route Details</h3>
      <button
        id="close-modal"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-200 transition-colors"
      >
        <i class="fas fa-times text-slate-500"></i>
      </button>
    </div>
    <div id="modal-content" class="p-4 overflow-y-auto max-h-[60vh]">
      <!-- Content injected via JS -->
    </div>
  </div>
</div>
{% endblock %}
